spring:
  ai:
    openai:
      api-key: test-openai-key
      chat:
        options:
          model: gpt-4o-mini
  datasource:
    url: jdbc:h2:mem:readum;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

auth:
  access-token-ttl: PT30M
  refresh-token-ttl: P14D
  refresh-grace-period: PT3S

jwt:
  secret: dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGVzdA==
  issuer: readum-test
  refresh-cookie-secure: false
  blacklist-max-size: 10000

ai-chat:
  context-window:
    max-turns: 20
  message:
    max-content-length: 4000
  rate-limit:
    count-period-seconds: 10
    max-message-count: 5
    rejected-count-period-seconds: 3600
    rejected-max-message-count: 20
  title-generation:
    thread-cap: 32
    queue-cap: 64
  summary-draft:
    min-accumulated-tokens: 500

aladin:
  ttb-key: test-ttb-key
  base-url: http://test.aladin.local/ttb/api
  search-target: Book
  output: JS
  version: 20131101
  cover: Big
  request-timeout: PT1S
  search-result-limit: 200

summary:
  rate-limit:
    requests-per-minute: 9000
    tokens-per-minute: 180000
    max-request-tokens: 120000
    acquire-max-wait-seconds: 10

summary-job:
  pool-size: 3
  dispatch-interval-ms: 2000
  reaper-interval-ms: 60000
  lease-seconds: 300
  max-attempts: 5
  base-backoff-seconds: 60
  reserved-output-tokens: 1024
