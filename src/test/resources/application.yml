spring:
  ai:
    openai:
      api-key: test-openai-key
      chat:
        options:
          model: gpt-4o-mini
  flyway:
    enabled: false   # 테스트는 H2 + ddl-auto create-drop (MySQL 전용 V1 SQL 은 H2 에 적용 불가)
  datasource:
    # 운영 프로파일이 URL 에 붙이는 socketTimeout 은 여기 두지 않는다 — H2 는 모르는 설정을 거부한다
    # (JdbcSQLNonTransientConnectionException: Unsupported connection setting "SOCKETTIMEOUT", h2 2.2.224 로 확인).
    # 소켓 읽기 기한은 실제 네트워크 연결에만 의미가 있고, 인메모리 H2 에는 기다릴 소켓 자체가 없다.
    url: jdbc:h2:mem:readum;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

auth:
  access-token-ttl: PT30M
  refresh-token-ttl: P14D
  refresh-grace-period: PT3S

jwt:
  secret: dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGVzdA==
  issuer: readum-test
  refresh-cookie-secure: false
  blacklist-max-size: 10000

ai-chat:
  context:
    assembly-recent-raw-max-tokens: 8000
    keep-recent-raw-tokens: 2000
    summarize-trigger-token-threshold: 4000
    summary-estimated-output-tokens: 800
  message:
    max-content-length: 1000
  rate-limit:
    count-period-seconds: 10
    max-message-count: 5
  token-budget:
    daily-tokens: 120000
    estimated-output-tokens: 512
  streaming:
    generation-total-timeout-seconds: 120
    generation-idle-timeout-seconds: 30
    delivery-timeout-seconds: 150
    shutdown-wait-seconds: 60
    prepare-allowance-seconds: 60
    post-processing-allowance-seconds: 60
    delivery-queue-capacity: 256
    max-in-flight-turns: 300
  turn-recovery:
    # 테스트에서는 배경 스캔이 사실상 돌지 않게 한다. 만료 복구 테스트는 일부러 기한이 지난 행을 커밋해 두는데,
    # 같은 컨텍스트의 스케줄러가 그 행을 먼저 만료시키면 단언이 시점에 따라 흔들린다.
    # 복구 동작 자체는 테스트가 판정 기준 시각을 직접 넘겨 확인한다.
    scan-interval-ms: 3600000
    grace-seconds: 86400
    max-rows-per-run: 100

aladin:
  ttb-key: test-ttb-key
  base-url: http://test.aladin.local/ttb/api
  search-target: Book
  output: JS
  version: 20131101
  cover: Big
  request-timeout: PT1S
  search-result-limit: 200

openai-gate:
  models:
    gpt-4o-mini:
      requests-per-minute: 9000
      tokens-per-minute: 180000
  quota-cooldown-seconds: 300

summary-job:
  pool-size: 3
  dispatch-interval-ms: 2000
  reaper-interval-ms: 60000
  lease-seconds: 300
  max-attempts: 5
  base-backoff-seconds: 60
  max-request-tokens: 120000
  estimated-output-tokens: 1024

context-summary-job:
  pool-size: 2
  dispatch-interval-ms: 2000
  reaper-interval-ms: 60000
  lease-seconds: 120
  max-attempts: 5
  base-backoff-seconds: 60
  max-request-tokens: 120000
