jwt:
  secret: ${JWT_SECRET:}
  issuer: readum
  access-token-ttl: PT30M
  refresh-token-ttl: P14D
  refresh-grace-period: PT3S
  refresh-cookie-secure: true
  blacklist-max-size: 10000

user:
  session-cookie-secure: true

ai-chat:
  context-window:
    max-turns: 20            # 1턴 = USER 메시지 1 + ASSISTANT 메시지 1
  message:
    max-content-length: 1000
  rate-limit:
    burst-window-seconds: 10  # 슬라이딩 윈도우 길이 (초)
    burst-max-count: 5        # 윈도우 내 USER 메시지 허용 횟수. 초과 시 HTTP 429.

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
