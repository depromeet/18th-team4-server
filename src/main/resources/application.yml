spring:
  application:
    name: readum
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: true

server:
  forward-headers-strategy: framework

auth:
  access-token-ttl: PT30M
  refresh-token-ttl: P14D
  refresh-grace-period: PT3S

jwt:
  secret: ${JWT_SECRET:}
  issuer: readum
  refresh-cookie-secure: true
  blacklist-max-size: 10000

user:
  session-cookie-secure: true

ai-chat:
  context-window:
    max-turns: 20            # 1턴 = USER 메시지 1 + ASSISTANT 메시지 1
  message:
    max-content-length: 4000
  rate-limit:
    count-period-seconds: 10            # 정상 메시지 카운트 기간 (초).
    max-message-count: 5                # 기간 안에 허용되는 COMPLETED USER 메시지 수. 초과 시 HTTP 429.
    rejected-count-period-seconds: 3600 # 거부 메시지 카운트 기간 (초). 어뷰즈 탐지용으로 넓게.
    rejected-max-message-count: 20      # 기간 안에 허용되는 REJECTED USER 메시지 수. 초과 시 HTTP 429.

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 로그 파일 저장 정책 (logback-spring.xml 의 dev/prod 프로파일에서 참조).
# 운영 서버에서는 path 디렉터리를 미리 만들고 애플리케이션 계정에 쓰기 권한을 줘야 한다.
log:
  config:
    path: /var/log/readum
    filename: readum
    max-file-size: 20MB
    max-history: 7
    total-size-cap: 500MB
    ai-audit:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 300MB

# Actuator 운영 엔드포인트. health/info/prometheus/metrics 만 노출한다.
# prometheus 엔드포인트는 외부에 공개하지 말고 내부망(127.0.0.1 등)으로만 접근을 제한한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

summary-job:
  pool-size: 3
  dispatch-interval-ms: 2000
  reaper-interval-ms: 60000
  lease-seconds: 300        # 5분 lease
  max-attempts: 5
  base-backoff-seconds: 60  # 1분 → 2분 → 4분 …