spring:
  application:
    name: readum
  # 긴 외부 호출(AI 스트림) 동안 DB 커넥션을 요청 내내 붙잡지 않도록 OSIV 를 끈다 (#103).
  # 엔티티에 JPA 연관관계가 0개라 트랜잭션 밖 LAZY 접근이 없어 LazyInitializationException 위험이 없다.
  jpa:
    open-in-view: false
  # 블로킹 I/O(입력 moderation 동기 호출 등)를 값싸게 대량 동시 처리 (#103). Java 25 라 synchronized 핀닝은 사실상 해소됨.
  threads:
    virtual:
      enabled: true
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: true
  # @Scheduled 3개(6시 적재 · dispatch · reaper)가 단일 스레드에서 직렬화되지 않도록 풀 분리.
  task:
    scheduling:
      pool:
        size: 3
  # graceful shutdown 시 진행 중 HTTP 요청을 기다려 주는 시간 (#108).
  # AI 채팅 SSE 스트림이 가장 긴 요청이라 기본값 30초 대신 60초.
  # 배포 시 nginx 가 새 요청을 먼저 새 프로세스로 돌린 뒤 종료하므로, 이 대기는 배포 소요 시간만 늘릴 뿐 사용자 영향이 없다.
  lifecycle:
    timeout-per-shutdown-phase: 60s

server:
  forward-headers-strategy: framework
  # SIGTERM 을 받으면 새 요청은 즉시 거부하고 진행 중 요청만 위 대기 시간 안에서 마무리한다 (#108).
  # Spring Boot 3.4+ 기본값이지만, 배포 절차(구 프로세스 종료 단계)가 이 동작에 의존하므로 명시해 둔다.
  shutdown: graceful

auth:
  access-token-ttl: PT30M
  refresh-token-ttl: P14D
  refresh-grace-period: PT3S

jwt:
  secret: ${JWT_SECRET:}
  issuer: readum
  refresh-cookie-secure: true
  blacklist-max-size: 10000

user:
  session-cookie-secure: true

ai-chat:
  context-window:
    max-turns: 20            # 1턴 = USER 메시지 1 + ASSISTANT 메시지 1
  message:
    max-content-length: 1000
  rate-limit:
    count-period-seconds: 10 # 상태 무관 USER 메시지 카운트 기간 (초).
    max-message-count: 5     # 기간 안에 허용되는 USER 메시지 수. 초과 시 HTTP 429.
  token-budget:
    window-hours: 4              # KST 자정 앵커 창 크기 (00·04·08·12·16·20시 시작)
    tokens-per-window: 20000     # 창당 토큰 예산 (사용자 메시지 입력 + 받은 출력만 계상, 채팅 스트림만)
    estimated-output-tokens: 512 # 예약 시 더하는 출력 추정값 (실측 도착 시 보정)
  title-generation:                     # 제목 생성 전용 스케줄러(영속화 풀과 격벽 분리).
    thread-cap: 32                       # 동시 제목 생성 상한. 스레드는 lazy 생성 + 60초 유휴 회수라 평소엔 0 에 수렴.
                                         # 저빈도 백그라운드라 32 면 충분. 전용 ChatClient 의 10초 responseTimeout 이 매달린 호출을 끊어 blast-radius 를 시간으로 제한.
    queue-cap: 64                        # backing thread 1개당 큐 한도(per-thread). 전역 backlog 상한 = thread-cap × queue-cap = 32 × 64 ≈ 2,048. 초과 시 RejectedExecutionException(로그 후 스킵).

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 로그 파일 저장 정책 (logback-spring.xml 의 dev/prod 프로파일에서 참조).
# 운영 서버에서는 path 디렉터리를 미리 만들고 애플리케이션 계정에 쓰기 권한을 줘야 한다.
log:
  config:
    path: /var/log/readum
    filename: readum
    max-file-size: 20MB
    max-history: 7
    total-size-cap: 500MB
    ai-audit:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 300MB

# Actuator 운영 엔드포인트. health/info/prometheus/metrics 만 노출한다.
# prometheus 엔드포인트는 외부에 공개하지 말고 내부망(127.0.0.1 등)으로만 접근을 제한한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

# OpenAI 전역 게이트 — 모델별 분당 예산 (계정 한도 RPM 10,000 / TPM 200,000 의 90%).
# 모든 outbound 경로(채팅·제목·감상문)가 호출 전 검사·계상한다. 초과 시 정책은 호출 지점 소유 (채팅 429 / 제목 생략 / 감상문 재큐).
openai-gate:
  models:
    gpt-4o-mini:
      requests-per-minute: 9000
      tokens-per-minute: 180000

# 감상문 생성 OpenAI 호출 예산(계정 한도의 안전여유 적용). 외부 API 설정.
# 계정 한도: RPM 10,000 / TPM 200,000(병목). 90% 안전여유 적용.
summary:
  rate-limit:
    requests-per-minute: 9000
    tokens-per-minute: 180000
    max-request-tokens: 120000        # 양동이 용량. 모델 가용 한도 수준. 초과 요청은 워커가 fail-fast.
    acquire-max-wait-seconds: 10      # lease(300s)보다 충분히 짧게

summary-job:
  pool-size: 12
  dispatch-interval-ms: 2000
  reaper-interval-ms: 60000
  lease-seconds: 300        # 5분 lease
  max-attempts: 5
  base-backoff-seconds: 60  # 1분 → 2분 → 4분 …
  reserved-output-tokens: 1024  # 토큰 추정 시 호출당 예약 출력 토큰