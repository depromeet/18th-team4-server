spring:
  application:
    name: readum
  # 긴 외부 호출(AI 스트림) 동안 DB 커넥션을 요청 내내 붙잡지 않도록 OSIV 를 끈다 (#103).
  # 엔티티에 JPA 연관관계가 0개라 트랜잭션 밖 LAZY 접근이 없어 LazyInitializationException 위험이 없다.
  jpa:
    open-in-view: false
  # 블로킹 I/O(입력 moderation 동기 호출 등)를 값싸게 대량 동시 처리 (#103). Java 25 라 synchronized 핀닝은 사실상 해소됨.
  threads:
    virtual:
      enabled: true
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: true
  # @Scheduled 3개(6시 적재 · dispatch · reaper)가 단일 스레드에서 직렬화되지 않도록 풀 분리.
  task:
    scheduling:
      pool:
        size: 3

server:
  forward-headers-strategy: framework

auth:
  access-token-ttl: PT30M
  refresh-token-ttl: P14D
  refresh-grace-period: PT3S

jwt:
  secret: ${JWT_SECRET:}
  issuer: readum
  refresh-cookie-secure: true
  blacklist-max-size: 10000

user:
  session-cookie-secure: true

ai-chat:
  context-window:
    max-turns: 20            # 1턴 = USER 메시지 1 + ASSISTANT 메시지 1
  message:
    max-content-length: 4000
  rate-limit:
    count-period-seconds: 10            # 정상 메시지 카운트 기간 (초).
    max-message-count: 5                # 기간 안에 허용되는 COMPLETED USER 메시지 수. 초과 시 HTTP 429.
    rejected-count-period-seconds: 3600 # 거부 메시지 카운트 기간 (초). 어뷰즈 탐지용으로 넓게.
    rejected-max-message-count: 20      # 기간 안에 허용되는 REJECTED USER 메시지 수. 초과 시 HTTP 429.
  title-generation:                     # 제목 생성 전용 스케줄러(영속화 풀과 격벽 분리).
    thread-cap: 32                       # 동시 제목 생성 상한. 스레드는 lazy 생성 + 60초 유휴 회수라 평소엔 0 에 수렴.
                                         # 저빈도 백그라운드라 32 면 충분. 전용 ChatClient 의 10초 responseTimeout 이 매달린 호출을 끊어 blast-radius 를 시간으로 제한.
    queue-cap: 64                        # backing thread 1개당 큐 한도(per-thread). 전역 backlog 상한 = thread-cap × queue-cap = 32 × 64 ≈ 2,048. 초과 시 RejectedExecutionException(로그 후 스킵).
  summary-draft:
    min-accumulated-tokens: 500          # 감상문 생성에 필요한 최소 누적 토큰 (확정 정책값)

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 로그 파일 저장 정책 (logback-spring.xml 의 dev/prod 프로파일에서 참조).
# 운영 서버에서는 path 디렉터리를 미리 만들고 애플리케이션 계정에 쓰기 권한을 줘야 한다.
log:
  config:
    path: /var/log/readum
    filename: readum
    max-file-size: 20MB
    max-history: 7
    total-size-cap: 500MB
    ai-audit:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 300MB

# Actuator 운영 엔드포인트. health/info/prometheus/metrics 만 노출한다.
# prometheus 엔드포인트는 외부에 공개하지 말고 내부망(127.0.0.1 등)으로만 접근을 제한한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

# 감상문 생성 OpenAI 호출 예산(계정 한도의 안전여유 적용). 외부 API 설정.
# 계정 한도: RPM 10,000 / TPM 200,000(병목). 90% 안전여유 적용.
summary:
  rate-limit:
    requests-per-minute: 9000
    tokens-per-minute: 180000
    max-request-tokens: 120000        # 양동이 용량. 모델 가용 한도 수준. 초과 요청은 워커가 fail-fast.
    acquire-max-wait-seconds: 10      # lease(300s)보다 충분히 짧게

summary-job:
  pool-size: 12
  dispatch-interval-ms: 2000
  reaper-interval-ms: 60000
  lease-seconds: 300        # 5분 lease
  max-attempts: 5
  base-backoff-seconds: 60  # 1분 → 2분 → 4분 …
  reserved-output-tokens: 1024  # 토큰 추정 시 호출당 예약 출력 토큰