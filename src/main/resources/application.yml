spring:
  application:
    name: readum
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: true

server:
  forward-headers-strategy: framework

auth:
  access-token-ttl: PT30M
  refresh-token-ttl: P14D
  refresh-grace-period: PT3S

jwt:
  secret: ${JWT_SECRET:}
  issuer: readum
  refresh-cookie-secure: true
  blacklist-max-size: 10000

user:
  session-cookie-secure: true

ai-chat:
  context-window:
    max-turns: 20            # 1턴 = USER 메시지 1 + ASSISTANT 메시지 1
  message:
    max-content-length: 4000
  rate-limit:
    count-period-seconds: 10            # 정상 메시지 카운트 기간 (초).
    max-message-count: 5                # 기간 안에 허용되는 COMPLETED USER 메시지 수. 초과 시 HTTP 429.
    rejected-count-period-seconds: 3600 # 거부 메시지 카운트 기간 (초). 어뷰즈 탐지용으로 넓게.
    rejected-max-message-count: 20      # 기간 안에 허용되는 REJECTED USER 메시지 수. 초과 시 HTTP 429.

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 로그 파일 저장 정책 (logback-spring.xml 의 dev/prod 프로파일에서 참조).
# 운영 서버에서는 path 디렉터리를 미리 만들고 애플리케이션 계정에 쓰기 권한을 줘야 한다.
log:
  config:
    path: /var/log/readum
    filename: readum
    max-file-size: 20MB
    max-history: 7
    total-size-cap: 500MB
    ai-audit:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 300MB

# Actuator 운영 엔드포인트. health/info/prometheus/metrics 만 노출한다.
# prometheus 엔드포인트는 외부에 공개하지 말고 내부망(127.0.0.1 등)으로만 접근을 제한한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

# 감상문 생성 OpenAI 호출 예산(계정 한도의 안전여유 적용). 외부 API 설정.
# 계정 한도: RPM 10,000 / TPM 200,000(병목). 90% 안전여유 적용.
summary:
  rate-limit:
    requests-per-minute: 9000
    tokens-per-minute: 180000
    max-request-tokens: 120000        # 양동이 용량. 모델 가용 한도 수준. 초과 요청은 워커가 fail-fast.
    acquire-max-wait-seconds: 10      # lease(300s)보다 충분히 짧게

summary-job:
  pool-size: 12
  dispatch-interval-ms: 2000
  reaper-interval-ms: 60000
  lease-seconds: 300        # 5분 lease
  max-attempts: 5
  base-backoff-seconds: 60  # 1분 → 2분 → 4분 …
  reserved-output-tokens: 1024  # 토큰 추정 시 호출당 예약 출력 토큰(batch 청킹에서도 재사용)

# 감상문 Batch builder·collector 비즈니스 룰.
# 정적 보장: builder-concurrency × chunk-token-limit × 안전계수 ≤ 계정 enqueued-token 한도 - 마진
# 위 값(2 × 1,500,000 = 3,000,000)은 운영 계정 한도에 맞춰 조정할 것.
summary-batch:
  builder-concurrency: 2
  chunk-token-limit: 1500000      # 청크당 토큰 안전 상한
  max-jobs-per-batch: 500
  submit-interval-ms: 5000
  collect-interval-ms: 60000
  build-lease-seconds: 300        # BATCH_BUILDING 점유 시한(업로드+제출 최악 소요 초과)

# OpenAI Batch API 어댑터 설정. api-key 는 환경변수로, model·base-url·completion-window·request-timeout 은 application.yml 기본값.
openai-batch:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini             # Batch API 에서 사용할 모델
  base-url: https://api.openai.com/v1
  completion-window: 24h         # OpenAI 가 현재 지원하는 유일한 완료 대기 창 값
  request-timeout: PT60S         # 파일 업로드·다운로드를 포함하므로 넉넉하게 60초 설정