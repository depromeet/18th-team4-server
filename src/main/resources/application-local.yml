# 로컬 개발 프로파일 (SPRING_PROFILES_ACTIVE=local). 환경별 값만 둔다 —
# 환경 무관 값(openai 옵션·jpa·guardrail·aladin)은 application.yml 이 정본이다.
# 접속 대상은 로컬 컨테이너(infra/docker/docker-compose.local.yml 의 MySQL·Redis)다.
# logback 은 local 블록(콘솔만)이 켜진다 — 파일(/var/log/readum)도 Slack 알림도 붙지 않으므로
# 로컬에서 난 ERROR 가 팀 채널로 가지 않는다. dev 와 다른 점은 접속 대상·로그 목적지·풀 크기뿐이다.
spring:
  datasource:
    # socketTimeout=60000 — 소켓 읽기 기한 60초(앱 전체 공통). 기한이 없으면 조용히 끊긴 소켓을
    # 커널 keepalive 시간(리눅스 기본 약 2시간)까지 기다려, 그 호출을 하던 스레드와 풀 연결이 회수되지 않는다.
    # 60초로 둔 근거와 다른 대기 제한(Hikari connection-timeout · innodb_lock_wait_timeout)과의 관계는
    # docs/ops/ai-chat-shutdown-and-recovery.md 의 "DB 연결의 대기 제한" 절에 있다.
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:readum}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&socketTimeout=60000
    username: ${MYSQL_USER:readum}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Hikari 풀은 기본값(10)을 그대로 쓴다 — dev 의 24 는 서버의 워커·웹 동시성 계산값이라 로컬엔 불필요.
    # DB 대기 제한 둘을 앱에서 못박는다 — 서버 설정에 기대지 않고 로컬 컨테이너·RDS 어디서든 같은 값이 되게.
    # 근거와 세 제한(연결 획득 · 소켓 읽기 · 행 잠금 대기)의 관계는
    # docs/ops/ai-chat-shutdown-and-recovery.md 의 "DB 연결의 대기 제한" 절에 있다.
    hikari:
      # 풀에서 연결 하나를 빌리기까지 기다리는 최대 시간. 기본 30초 → 10초.
      # 풀이 10초 넘게 비어 있는 상황은 어느 기능에서든 정상이 아니다. 채팅 후처리 여유 20초
      # (= 연결 획득 10 + 저장·정산 10)가 성립하려면 이 값이 그 안에 들어야 한다.
      connection-timeout: 10000
      # 한 트랜잭션이 다른 트랜잭션이 쥔 행 잠금을 기다리는 최대 시간(초). MySQL 기본 50초 → 5초.
      # 넘으면 그 문장이 오류로 끝나 트랜잭션이 롤백된다(JPA 예외 → Spring 롤백).
      # 채팅에서는 요청 행을 FOR UPDATE 로 잠그는 후처리와 미정산 예약 반환이 같은 행에서 만나는 순간에,
      # 그 밖의 기능(감상문 잡 적재 등)에서는 각자의 잠금 경합에 걸린다.
      # URL 의 socketTimeout 60초가 이 값보다 길어, 잠금 대기는 항상 DB 쪽에서 먼저 정상 오류로 끝난다.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
      password: ${REDIS_PASSWORD}

# 콘솔에는 앱 코드 DEBUG 만 살린다 (logback local root=INFO 와 짝 — dev 와 같은 원칙).
logging:
  level:
    com.readum: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
