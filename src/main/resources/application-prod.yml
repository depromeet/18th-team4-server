# 운영 서버 프로파일 (SPRING_PROFILES_ACTIVE=prod). 환경별 값만 둔다 —
# 환경 무관 값(openai 옵션·jpa·guardrail·aladin)은 application.yml 이 정본이다.
# 개발 서버와 같은 EC2 인스턴스에 공존하되, 접속 대상(운영 전용 MySQL·Redis 컨테이너)만 다르다.
# 접속 대상은 infra/docker/docker-compose.prod.yml 의 운영 전용 MySQL(127.0.0.1:3307)·Redis(127.0.0.1:6380)다.
# logback 은 prod 블록(콘솔 + 롤링 파일 + Slack + AI 감사)이 켜진다 — 운영 ERROR 는 운영 전용 Slack 채널로 간다
# (채널 구분은 운영 prod.env 의 SLACK_WEBHOOK_URL 이 담당하고, 알림 라벨 env 는 활성 프로파일 prod 를 그대로 쓴다).
spring:
  datasource:
    # 운영 전용 MySQL 컨테이너(127.0.0.1:3307). 호스트에서 systemd 로 도는 앱이 루프백으로 접속한다.
    # 개발 MySQL(3306)과 프로세스·볼륨·설정이 완전히 분리되어, 되돌릴 수 없는 데이터 계층을 격리한다.
    # socketTimeout=60000 — 소켓 읽기 기한 60초(앱 전체 공통). 기한이 없으면 조용히 끊긴 소켓을
    # 커널 keepalive 시간(리눅스 기본 약 2시간)까지 기다려, 그 호출을 하던 스레드와 풀 연결이 회수되지 않는다.
    # 60초로 둔 근거와 다른 대기 제한(Hikari connection-timeout · innodb_lock_wait_timeout)과의 관계는
    # docs/ops/ai-chat-shutdown-and-recovery.md 의 "DB 연결의 대기 제한" 절에 있다.
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&socketTimeout=60000
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 워커 풀(summary-job 12 + context-summary-job 4 = 최대 16)의 짧은 DB 단계와 웹 요청이 경합하지 않도록
    # 개발과 동일하게 24 로 둔다 (워커 동시성 계산값은 환경과 무관하므로 dev 와 같게 맞춘다).
    # 아래 두 대기 제한은 앱에서 못박는다 — 서버 설정에 기대지 않고 로컬 컨테이너·RDS 어디서든 같은 값이 되게.
    # 세 제한(연결 획득 · 소켓 읽기 · 행 잠금 대기)의 관계는
    # docs/ops/ai-chat-shutdown-and-recovery.md 의 "DB 연결의 대기 제한" 절에 있다.
    hikari:
      maximum-pool-size: 24
      # 풀에서 연결 하나를 빌리기까지 기다리는 최대 시간. 기본 30초 → 3초.
      # 풀이 3초 넘게 비어 있는 상황은 어느 기능에서든 정상이 아니다(앱 전체에 걸리는 값 —
      # 감상문 워커·요약 잡도 같은 풀을 쓴다). 채팅 후처리 여유 10초
      # (= 연결 획득 3 + 잠금 대기 5 + 커밋 몫 2)가 성립하려면 이 값이 그 안에 들어야 한다.
      connection-timeout: 3000
      # 한 트랜잭션이 다른 트랜잭션이 쥔 행 잠금을 기다리는 최대 시간(초). MySQL 기본 50초 → 5초.
      # 넘으면 그 문장이 오류로 끝나 트랜잭션이 롤백된다(JPA 예외 → Spring 롤백).
      # 채팅에서는 요청 행을 FOR UPDATE 로 잠그는 후처리와 미정산 예약 반환이 같은 행에서 만나는 순간에,
      # 그 밖의 기능(감상문 잡 적재 등)에서는 각자의 잠금 경합에 걸린다.
      # URL 의 socketTimeout 60초가 이 값보다 길어, 잠금 대기는 항상 DB 쪽에서 먼저 정상 오류로 끝난다.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}   # 앱은 호스트에서 systemd 로 돌고 운영 Redis 는 루프백(6380) 바인딩
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}

# 운영 콘솔(journald)에는 앱 코드 INFO 이상만 남긴다 — 운영은 DEBUG 도배를 피한다.
# (개발은 DEBUG 로 관찰하지만, 운영에서 상세 관찰이 필요하면 이 값을 한시적으로 DEBUG 로 올린다.)
logging:
  level:
    com.readum: INFO

# 운영에서는 API 문서(Swagger)를 공개하지 않는다 — 프론트 협업용 문서는 개발 서버(dev)에서만 노출한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
