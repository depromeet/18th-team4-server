# 개발 서버 프로파일 (SPRING_PROFILES_ACTIVE=dev). 환경별 값만 둔다 —
# 환경 무관 값(openai 옵션·jpa·guardrail·aladin)은 application.yml 이 정본이다.
spring:
  datasource:
    # sslMode 미지정 = PREFERRED (서버가 지원하면 TLS). RDS 시절의 REQUIRED 는 컨테이너 이관으로 제거 —
    # MySQL 이 127.0.0.1 에만 바인딩되어 루프백 구간 강제 TLS 는 실익이 없다.
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 두 워커 풀(summary-job.pool-size=12 + context-summary-job.pool-size=4 = 최대 16)의 짧은 DB 단계가
    # 순간적으로 겹쳐도 웹 요청과 경합하지 않도록 풀을 24 로 둔다(워커가 다 겹쳐도 웹에 ~8 커넥션 확보).
    # 워커는 TX 단계(수 ms)에서만 커넥션을 쥐고 느린 LLM 호출은 TX 밖이라 상시 점유는 이보다 훨씬 낮다.
    # EC2 Docker MySQL 의 max_connections(기본 151)의 약 16% 수준이라 외부 접속·증설 여지를 남긴다.
    # (minimum-idle 미지정 시 Hikari 가 max 와 같게 잡아 고정 크기)
    hikari:
      maximum-pool-size: 24
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}   # 앱은 호스트에서 systemd 로 돌고 Redis 는 루프백 바인딩
      port: 6379
      password: ${REDIS_PASSWORD}

# 콘솔(journald)에는 앱 코드 DEBUG 만 살린다. 파일은 logback 필터가 INFO 이상만 남긴다.
# org.hibernate.SQL DEBUG 는 두지 않는다 — 워커 폴링 SELECT(2초 주기)가 콘솔을 도배하고,
# 파일에는 어차피 INFO 필터로 안 남아 실익이 없다. SQL 관찰은 MySQL slow_log(TABLE)를 쓴다.
logging:
  level:
    com.readum: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
