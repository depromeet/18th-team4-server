spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?sslMode=REQUIRED&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.readum: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: WARN

jwt:
  secret: ${JWT_SECRET:}
  issuer: readum
  access-token-ttl: PT30M
  refresh-token-ttl: P14D
  refresh-grace-period: PT3S
  refresh-cookie-secure: true
  blacklist-max-size: 10000

aladin:
  ttb-key: ${ALADIN_TTB_KEY:}
  base-url: http://www.aladin.co.kr/ttb/api
  search-target: Book
  output: JS
  version: 20131101
  cover: Big
  request-timeout: PT1S
  search-result-limit: 200
