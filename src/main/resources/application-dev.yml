spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          stream-usage: true
          max-tokens: 1024
      moderation:
        options:
          model: omni-moderation-latest
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?sslMode=REQUIRED&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

readum:
  guardrail:
    input:
      max-characters: 4000
      max-tokens: 1500
    output:
      max-response-tokens: 1024
    moderation:
      model: omni-moderation-latest
      # 책 맥락 유무와 무관하게 항상 차단. 카테고리 이름 정본은 OpenAiInputModerationClientImpl 레지스트리.
      always-block-categories:
        - self-harm
        - self-harm-intent
        - self-harm-instructions
        - sexual-minors
        - dangerous-and-criminal-content
      # 책 맥락(독서 토론) 이 있을 때만 통과시키는 카테고리.
      book-context-relaxed-categories:
        - violence
        - violence-graphic
        - harassment
        - harassment-threatening
        - sexual
        - hate
        - hate-threatening
      # 외부 Moderation API 장애 시 차단 우선(503). OPEN 은 개발 환경에서만 명시 전환.
      failure-policy: CLOSED
    rate-limit:
      enabled: true
      requests-per-minute: 20
      daily-requests: 200

logging:
  level:
    com.readum: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: WARN

aladin:
  ttb-key: ${ALADIN_TTB_KEY:}
  base-url: https://www.aladin.co.kr/ttb/api
  search-target: Book
  output: JS
  version: 20131101
  cover: Big
  request-timeout: PT1S
  search-result-limit: 200

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true