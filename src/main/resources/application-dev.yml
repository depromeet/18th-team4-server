spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          stream-usage: true
          # max-tokens 를 두지 않는다 — 응답을 중간에 자르는 하드 스톱이라 어느 경로에도 걸지 않는다.
          # 특히 컨텍스트 누적 요약은 잘리면 정보가 유실되므로 절대 금지(압축 스펙 8절).
          # 비용 상한은 truncation 이 아니라 사용자 토큰 예산(Redis 4h/20k) + 전역 게이트가 담당한다.
      moderation:
        options:
          model: omni-moderation-latest
  datasource:
    # sslMode 미지정 = PREFERRED (서버가 지원하면 TLS). RDS 시절의 REQUIRED 는 컨테이너 이관으로 제거 —
    # MySQL 이 127.0.0.1 에만 바인딩되어 루프백 구간 강제 TLS 는 실익이 없다.
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 두 워커 풀(summary-job.pool-size=12 + context-summary-job.pool-size=4 = 최대 16)의 짧은 DB 단계가
    # 순간적으로 겹쳐도 웹 요청과 경합하지 않도록 풀을 24 로 둔다(워커가 다 겹쳐도 웹에 ~8 커넥션 확보).
    # 워커는 TX 단계(수 ms)에서만 커넥션을 쥐고 느린 LLM 호출은 TX 밖이라 상시 점유는 이보다 훨씬 낮다.
    # EC2 Docker MySQL 의 max_connections(기본 151)의 약 16% 수준이라 외부 접속·증설 여지를 남긴다.
    # (minimum-idle 미지정 시 Hikari 가 max 와 같게 잡아 고정 크기)
    hikari:
      maximum-pool-size: 24
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}   # 앱은 호스트에서 systemd 로 돌고 Redis 는 루프백 바인딩
      port: 6379
      password: ${REDIS_PASSWORD}

readum:
  guardrail:
    input:
      max-characters: 4000
      max-tokens: 1500
    output:
      max-response-tokens: 1024
    moderation:
      model: omni-moderation-latest
      # 책 맥락 유무와 무관하게 항상 차단. 카테고리 이름 정본은 OpenAiInputModerationClientImpl 레지스트리.
      always-block-categories:
        - self-harm
        - self-harm-intent
        - self-harm-instructions
        - sexual-minors
        - dangerous-and-criminal-content
      # 책 맥락(독서 토론) 이 있을 때만 통과시키는 카테고리.
      book-context-relaxed-categories:
        - violence
        - violence-graphic
        - harassment
        - harassment-threatening
        - sexual
        - hate
        - hate-threatening
      # 외부 Moderation API 장애 시 차단 우선(503). OPEN 은 개발 환경에서만 명시 전환.
      failure-policy: CLOSED

# 콘솔(journald)에는 앱 코드 DEBUG 만 살린다. 파일은 logback 필터가 INFO 이상만 남긴다.
# org.hibernate.SQL DEBUG 는 두지 않는다 — 워커 폴링 SELECT(2초 주기)가 콘솔을 도배하고,
# 파일에는 어차피 INFO 필터로 안 남아 실익이 없다. SQL 관찰은 MySQL slow_log(TABLE)를 쓴다.
logging:
  level:
    com.readum: DEBUG

aladin:
  ttb-key: ${ALADIN_TTB_KEY:}
  base-url: https://www.aladin.co.kr/ttb/api
  search-target: Book
  output: JS
  version: 20131101
  cover: Big
  request-timeout: PT3S
  search-result-limit: 200

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true