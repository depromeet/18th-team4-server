plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

ext {
	set('springAiVersion', "2.0.0-M4")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.retry:spring-retry:2.0.12'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'com.bucket4j:bucket4j-core:8.10.1'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		// Guardrail 평가 / 벤치마크 테스트는 시간이 오래 걸리거나 외부 API(OpenAI Moderation 등)를
		// 호출할 수 있으므로 기본 빌드(./gradlew test, ./gradlew build)에서는 실행하지 않는다.
		// 수동으로 ./gradlew guardrailTest 로만 실행한다.
		excludeTags 'guardrail'
	}
}

tasks.register('guardrailTest', Test) {
	group = 'verification'
	description = '가드레일 / 프롬프트 인젝션 방어 테스트 (수동 실행 전용). CI 빌드에서 자동 실행되지 않음.'
	useJUnitPlatform {
		includeTags 'guardrail'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')
	// `./gradlew check` / `./gradlew build` 에 끌려들어가지 않도록 명시적으로 분리

	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = true
	}
}

tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', 'dev'
}
