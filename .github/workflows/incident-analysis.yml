# 운영 장애 분석 워크플로우.
# Slack ERROR 알림의 "분석 이슈 열기" 링크(또는 이슈에 수동으로 error 라벨 부착)로
# error 라벨 이슈가 생기면, 이슈 본문의 배포 커밋을 checkout 해 Claude Code 가
# 원인 후보를 분석하고 이슈 코멘트로 남긴 뒤 Slack 으로 완료/실패를 알린다.
# 배포 파이프라인(deploy.yml)과 완전히 독립이다. 전체 흐름: docs/ops/incident-analysis.md

name: incident-analysis

on:
  issues:
    types: [labeled]

# 같은 이슈에 라벨이 여러 번 붙어도 분석은 한 번에 하나만 돈다 (뒤 실행은 대기).
concurrency:
  group: incident-analysis-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event.label.name == 'error'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 배포 커밋이 기본 브랜치보다 뒤에 있을 수 있어 전체 이력을 받는다
          fetch-depth: 0

      # 배포 커밋 checkout 으로 작업 트리가 과거로 가도 스크립트를 쓸 수 있게 미리 복사해 둔다
      - name: Slack 알림 스크립트 보존
        run: cp .github/scripts/incident-slack-notify.sh "$RUNNER_TEMP/"

      - name: 배포 커밋 checkout (이슈 본문의 deploy-sha 마커)
        id: deploy_sha
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          SHA=$(printf '%s' "$ISSUE_BODY" \
            | grep -oE '<!-- deploy-sha: [0-9a-fA-F]{7,40} -->' | head -1 \
            | grep -oE '[0-9a-fA-F]{7,40}' || true)
          if [ -n "$SHA" ] && git rev-parse --verify --quiet "${SHA}^{commit}" > /dev/null; then
            git checkout --quiet "$SHA"
            echo "note=배포 커밋 ${SHA} 기준" >> "$GITHUB_OUTPUT"
          else
            echo "note=본문에서 배포 커밋을 찾지 못해 기본 브랜치 최신 커밋 기준" >> "$GITHUB_OUTPUT"
          fi

      # 원본 에러 알림(본문에 같은 fingerprint 포함)을 채널 최근 이력에서 찾아 스레드 ts 를 얻는다.
      # Bot 토큰/채널 ID 미설정이거나 탐색 실패면 ts 는 빈 값 → 이후 알림은 전부 webhook 채널 메시지로 동작.
      - name: 원본 에러 알림 스레드 찾기 + 분석 시작 알림
        id: slack_thread
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REQUESTER: ${{ github.event.sender.login }}
        run: |
          THREAD_TS=""
          FINGERPRINT=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^- fingerprint: `\(.*\)`.*$/\1/p' | head -1)
          if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -n "${SLACK_CHANNEL_ID:-}" ] && [ -n "$FINGERPRINT" ]; then
            HISTORY=$(curl -sS -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              "https://slack.com/api/conversations.history?channel=${SLACK_CHANNEL_ID}&limit=200" || echo '{}')
            # "ERROR 발생" 마커로 원본 에러 알림만 고른다 — 이 워크플로우가 남기는 분석 메시지에도 fingerprint 가 들어가므로
            THREAD_TS=$(printf '%s' "$HISTORY" | jq -r --arg fingerprint "$FINGERPRINT" \
              '[.messages[]? | select(((.text // "") | contains($fingerprint)) and ((.text // "") | contains("ERROR 발생")))] | (first.ts // empty)')
          fi
          echo "thread_ts=$THREAD_TS" >> "$GITHUB_OUTPUT"
          bash "$RUNNER_TEMP/incident-slack-notify.sh" \
            ":mag: *장애 분석 시작* — <${ISSUE_URL}|#${ISSUE_NUMBER} ${ISSUE_TITLE}> (요청: ${REQUESTER})" \
            "$THREAD_TS" false

      - name: Claude Code 분석
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*)"'
          prompt: |
            너는 운영 장애 분석 담당이다. GitHub 이슈 #${{ github.event.issue.number }} 는
            운영 ERROR 로그에서 만들어진 장애 분석 요청이다.
            현재 checkout 된 코드는 ${{ steps.deploy_sha.outputs.note }}이다.

            절차:
            1. `gh issue view ${{ github.event.issue.number }}` 로 이슈 본문(메시지·stacktrace·fingerprint·traceId)을 읽는다.
            2. stacktrace 의 com.readum 프레임을 중심으로 관련 코드를 읽고 원인 후보를 찾는다.
            3. 분석 결과를 파일로 작성해 `gh issue comment ${{ github.event.issue.number }} --body-file <파일>` 로 남긴다.

            코멘트 형식 (한국어 본문, 코드 식별자는 영문 유지):
            - 첫 줄: 한 줄 요약 — Slack 완료 알림에 이 줄이 그대로 실린다
            - `## 원인 후보` — 가능성이 높은 순으로 최대 3개. 각각 근거 코드 경로(`파일:라인`)와 판단 근거를 적는다
            - `## 재현 조건` — 어떤 상황에서 발생하는지 추정
            - `## 수정 방향` — 후보별 수정 제안
            - 분석이 기본 브랜치 기준이면(배포 커밋을 못 찾은 경우) 그 사실을 명시한다

            주의: 코드를 수정하거나 PR 을 만들지 않는다. 분석과 이슈 코멘트만 한다.
            확신이 없는 부분은 확신이 없다고 적는다.

      - name: Slack 완료 알림 (스레드 우선, 채널에도 노출)
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          THREAD_TS: ${{ steps.slack_thread.outputs.thread_ts }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # 마지막 코멘트(방금 남긴 분석)의 첫 줄을 요약으로 싣는다
          SUMMARY=$(gh issue view "$ISSUE_NUMBER" --json comments \
            --jq '.comments | last | .body' 2>/dev/null | head -n 1 | cut -c1-300 || true)
          TEXT=":white_check_mark: *장애 분석 완료* — <${ISSUE_URL}|#${ISSUE_NUMBER} ${ISSUE_TITLE}>"
          if [ -n "$SUMMARY" ]; then
            TEXT="${TEXT}"$'\n'"${SUMMARY}"
          fi
          bash "$RUNNER_TEMP/incident-slack-notify.sh" "$TEXT" "$THREAD_TS" true

      - name: Slack 실패 알림 (스레드 우선, 채널에도 노출)
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          THREAD_TS: ${{ steps.slack_thread.outputs.thread_ts }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=":rotating_light: *장애 분석 실패* — <${ISSUE_URL}|#${ISSUE_NUMBER}> 분석이 실패했다. <${RUN_URL}|Actions 로그>"
          # 보존 step 전에 실패한 경우를 대비해 저장소 원본 경로로도 시도한다
          NOTIFY="$RUNNER_TEMP/incident-slack-notify.sh"
          [ -f "$NOTIFY" ] || NOTIFY=".github/scripts/incident-slack-notify.sh"
          bash "$NOTIFY" "$TEXT" "$THREAD_TS" true
