# PR·dev 푸시 검증 파이프라인 — 빌드(전체 테스트 포함)만 하고 배포는 하지 않는다.
# 목적: 테스트 실패를 "배포 때 처음"이 아니라 "머지 전 PR"에서 잡는다.
# 배포(deploy.yml)도 배포 자격 판정용으로 빌드를 다시 하지만, 그 전에 여기서 먼저 걸러진다.

name: ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# 같은 브랜치의 이전 실행은 취소하고 최신 것만 돌린다 (PR 연속 푸시 시 낭비 방지).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # 토큰 버킷 Lua 스크립트 테스트는 자기 몫의 redis-server 를 빈 포트에 직접 띄운다 —
      # 바이너리가 없으면 조용히 건너뛰므로, CI 에서도 실제로 돌도록 여기서 설치한다.
      # 우분투 패키지는 설치와 동시에 6379 에 서비스를 띄우므로, 테스트가 띄운 것만 남게 그 서비스는 내린다.
      - name: Redis 설치 (토큰 버킷 Lua 스크립트 테스트용)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true

      - name: 빌드 + 전체 테스트
        run: ./gradlew build
