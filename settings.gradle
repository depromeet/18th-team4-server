pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
    }
    plugins {
        id 'org.springframework.boot' version '4.0.5'
        id 'io.spring.dependency-management' version '1.1.7'
    }
}

rootProject.name = 'readum'
include 'readum-api'
include 'readum-log-processor'
